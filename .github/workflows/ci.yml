name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: bun run typecheck
      - run: bun run test
